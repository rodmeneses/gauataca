# Flyway config for BandSync.
# Connection comes from the FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD env vars
# (Flyway reads FLYWAY_* natively). Set them from Supabase → Settings → Database
# → Connection string, then run `flyway migrate` from the repo root.

[flyway]
locations = ["filesystem:db/migrations"]
baselineOnMigrate = true
baselineVersion = 1

[environments.default]
# url / user / password are read from the FLYWAY_* env vars.
