<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="circle">
      <circle cx="512" cy="512" r="512"/>
    </clipPath>
    <path id="star" d="M 0 -40 L 8.93 -12.30 L 38.04 -12.36 L 14.46 4.70 L 23.51 32.36 L 0 15.2 L -23.51 32.36 L -14.46 4.70 L -38.04 -12.36 L -8.93 -12.30 Z"/>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Venezuelan flag: three horizontal bands -->
  <g clip-path="url(#circle)">
    <rect x="0" y="0" width="1024" height="341.33" fill="#FFCC00"/>
    <rect x="0" y="341.33" width="1024" height="341.33" fill="#00247D"/>
    <rect x="0" y="682.67" width="1024" height="341.33" fill="#CF142B"/>
  </g>

  <!-- 7 stars in an arc across the blue band -->
  <g fill="#FFFFFF">
    <use href="#star" transform="translate(831.5 471.0) scale(0.55)"/>
    <use href="#star" transform="translate(772.4 434.9) scale(0.55)"/>
    <use href="#star" transform="translate(682.0 408.1) scale(0.55)"/>
    <use href="#star" transform="translate(512.0 393.8) scale(0.55)"/>
    <use href="#star" transform="translate(342.0 408.1) scale(0.55)"/>
    <use href="#star" transform="translate(251.6 434.9) scale(0.55)"/>
    <use href="#star" transform="translate(192.5 471.0) scale(0.55)"/>
  </g>

  <!-- Musical note (eighth note) -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <ellipse cx="460" cy="720" rx="95" ry="68" transform="rotate(-20 460 720)"/>
    <rect x="535" y="360" width="18" height="350" rx="9"/>
    <path d="M 544 360 C 645 360, 700 395, 700 480 C 660 435, 610 415, 544 415 Z"/>
  </g>
</svg>
