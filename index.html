<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <script>
      /* Stamp the theme onto <html> before first paint so there is no flash.
         Keep the storage key in sync with THEME_KEY in src/lib/prefs.ts. */
      (function () {
        try {
          var p = localStorage.getItem('guataca.theme');
          var resolved =
            p === 'light' || p === 'dark'
              ? p
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'dark' ? '#020617' : '#eef2f7');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>GUATACA</title>
    <meta name="description" content="Panel administrativo de la banda cooperativa GUATACA" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GUATACA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fonts are self-hosted (see scripts/vendor-fonts.mjs) so the app works fully offline. -->
    <link rel="preload" href="/fonts/IBMPlexSans-latin-056e4e24.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/SpaceGrotesk-latin-a0d054c4.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
